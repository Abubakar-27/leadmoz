  <style>
    :root {
      --fog: #f7f4ef;
      --ink: #1b1916;
      --stone: #6f6c66;
      --pebble: #9a968e;
      --line: rgba(27, 25, 22, .10);
      --display: "DM Sans", "Satoshi", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Fraunces", ui-serif, Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    ::selection {
      background: rgba(246, 146, 81, .28);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--fog);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      letter-spacing: -.01em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 60px;
      background-image:
        radial-gradient(720px 460px at 12% -6%, rgba(246, 146, 81, .14), transparent 60%),
        radial-gradient(640px 440px at 96% 4%, rgba(239, 91, 110, .10), transparent 55%),
        radial-gradient(rgba(27, 25, 22, .04) 1px, transparent 1.4px);
      background-size: auto, auto, 27px 27px;
    }

    .mark {
      width: 34px;
      height: 34px;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #fb923c 0%, #ef5b6e 130%);
      clip-path: polygon(0 0, 72% 0, 100% 100%, 0 100%);
      box-shadow: 0 10px 24px -8px rgba(239, 91, 110, .6);
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 100px;
      background: rgba(255, 255, 255, .8);
      color: var(--stone);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      box-shadow: rgba(24, 24, 37, .06) 0 2px 3px -2px;
    }

    .pill::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fb923c, #ef5b6e);
      animation: ping 2.2s ease-in-out infinite;
    }

    @keyframes ping {
      0%, 100% { box-shadow: 0 0 0 0 rgba(246, 146, 81, .35); }
      50% { box-shadow: 0 0 0 6px rgba(246, 146, 81, 0); }
    }

    .code {
      margin: 40px 0 4px;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: clamp(90px, 16vw, 160px);
      line-height: 1;
      letter-spacing: -.04em;
      background: linear-gradient(128deg, #ef5b6e 8%, #f69251 72%, #e2a34d 110%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(26px, 4.4vw, 40px);
      line-height: 1.12;
      letter-spacing: -.04em;
      text-align: center;
    }

    h1 em {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      letter-spacing: -.02em;
    }

    .desc {
      margin: 14px auto 0;
      max-width: 480px;
      color: var(--stone);
      font-size: 15.5px;
      line-height: 1.6;
      text-align: center;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 34px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 16px;
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: -.01em;
      text-decoration: none;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .2s ease, filter .2s ease;
      background: linear-gradient(135deg, #fb923c 0%, #ef5b6e 130%);
      color: #fff;
      box-shadow: 0 14px 30px -12px rgba(239, 91, 110, .55), inset 0 1px 0 rgba(255, 255, 255, .25);
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: saturate(1.08) brightness(1.03);
      box-shadow: 0 18px 34px -14px rgba(239, 91, 110, .6), inset 0 1px 0 rgba(255, 255, 255, .25);
    }

    .btn.secondary {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: rgba(24, 24, 37, .04) 0 1px 2px 0;
    }

    .btn.secondary:hover {
      color: #e2503f;
      border-color: rgba(246, 146, 81, .5);
      filter: none;
      box-shadow: rgba(24, 24, 37, .06) 0 8px 20px -10px;
    }

    .foot {
      margin-top: 56px;
      color: var(--pebble);
      font-size: 12.5px;
      text-align: center;
    }

    .made {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .made i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fb923c, #ef5b6e);
    }

    .made strong {
      color: var(--ink);
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {
      .mark,
      .pill::before {
        animation: none !important;
      }
    }
  </style>
